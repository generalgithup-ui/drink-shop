<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>QR Payment - DrinkHub</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>


<body class="auth-bg">


<div class="container">


<div class="auth-card text-center">

<h2>
QR Payment
</h2>


<p class="text-muted">

Scan the QR code to complete
your payment.

</p>


<img
src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=DrinkHub-Demo-Payment"
alt="QR Code"
class="img-fluid mb-3">


<h5 id="orderId"></h5>


<button
class="btn btn-success w-100"
onclick="confirmPayment()">

I Have Paid

</button>


</div>

</div>


<script src="js/database.js"></script>

<script>

const id =
new URLSearchParams(location.search).get("order");

document.getElementById("orderId").textContent =
id || "Order";


function confirmPayment(){

    let orders =
        getData(DB_KEYS.orders, []);

    let order =
        orders.find(item => item.id === id);

    if(order){

        order.status =
            "Confirmed";

    }

    setData(DB_KEYS.orders, orders);

    alert("Payment confirmed.");

    location.href =
        "orders.html";

}

</script>


</body>

</html>
