<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Menu - DrinkHub</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">

<div class="container">

<a
class="navbar-brand fw-bold"
href="index.html">

<i class="bi bi-cup-straw"></i>

DrinkHub

</a>


<button
class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#nav">

<span class="navbar-toggler-icon"></span>

</button>


<div
class="collapse navbar-collapse"
id="nav">


<ul class="navbar-nav me-auto">

<li class="nav-item">

<a
class="nav-link"
href="index.html">

Home

</a>

</li>


<li class="nav-item">

<a
class="nav-link active"
href="menu.html">

Menu

</a>

</li>


<li class="nav-item">

<a
class="nav-link"
href="orders.html">

My Orders

</a>

</li>

</ul>


<a
class="btn btn-warning position-relative me-2"
href="cart.html">

<i class="bi bi-cart"></i>

Cart

<span
id="cartCount"
class="badge bg-danger">

0

</span>

</a>


<a
id="loginBtn"
class="btn btn-outline-light"
href="login.html">

Login

</a>


<button
id="logoutBtn"
class="btn btn-outline-danger d-none">

Logout

</button>


</div>

</div>

</nav>


<div class="container py-5">


<div
class="d-flex flex-wrap justify-content-between align-items-center mb-4">


<div>

<h1>
Drink Menu
</h1>

<p class="text-muted">
Choose your favorite drink.
</p>

</div>


<div class="d-flex gap-2">

<input
id="searchInput"
class="form-control"
placeholder="Search drink...">


<select
id="categoryFilter"
class="form-select">

<option value="All">
All Categories
</option>

<option>
Coffee
</option>

<option>
Tea
</option>

<option>
Milk Tea
</option>

<option>
Smoothie
</option>

<option>
Juice
</option>

<option>
Soft Drink
</option>

</select>

</div>

</div>


<div
id="menuGrid"
class="row g-4">

</div>


</div>


<!-- CUSTOMIZE MODAL -->

<div
class="modal fade"
id="drinkModal"
tabindex="-1">


<div class="modal-dialog">

<div class="modal-content">


<div class="modal-header">

<h5
id="modalTitle"
class="modal-title">

Customize Drink

</h5>

<button
class="btn-close"
data-bs-dismiss="modal">

</button>

</div>


<div class="modal-body">


<input
type="hidden"
id="drinkId">


<div
id="drinkInfo"
class="mb-3">

</div>


<div class="row">


<div class="col-6 mb-3">

<label>
Size
</label>

<select
id="size"
class="form-select">

<option value="Small">
Small (+$0)
</option>

<option value="Medium">
Medium (+$0.50)
</option>

<option value="Large">
Large (+$1.00)
</option>

</select>

</div>


<div class="col-6 mb-3">

<label>
Quantity
</label>

<input
id="quantity"
type="number"
min="1"
value="1"
class="form-control">

</div>

</div>


<div class="mb-3">

<label>
Sugar
</label>

<select
id="sugar"
class="form-select">

<option>
0%
</option>

<option>
50%
</option>

<option selected>
100%
</option>

</select>

</div>


<div class="mb-3">

<label>
Ice
</label>

<select
id="ice"
class="form-select">

<option>
No Ice
</option>

<option>
Less Ice
</option>

<option selected>
Normal Ice
</option>

</select>

</div>


<div class="mb-3">

<label>
Topping (+$0.50)
</label>

<select
id="topping"
class="form-select">

<option value="None">
None
</option>

<option value="Pearl">
Pearl
</option>

<option value="Jelly">
Jelly
</option>

<option value="Cheese Foam">
Cheese Foam
</option>

</select>

</div>


</div>


<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Cancel

</button>


<button
id="addToCartBtn"
class="btn btn-warning">

Add to Cart

</button>

</div>


</div>

</div>

</div>


<script src="js/database.js"></script>

<script src="js/app.js"></script>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">

</script>

</body>

</html>
