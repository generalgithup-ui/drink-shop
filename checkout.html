<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Checkout - DrinkHub</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>


<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a
class="navbar-brand fw-bold"
href="index.html">

☕ DrinkHub

</a>

</div>

</nav>


<div class="container py-5">


<div class="row g-4">


<div class="col-lg-7">

<div class="form-card">

<h3>
Checkout
</h3>


<div id="checkoutAlert"></div>


<form id="checkoutForm">


<div class="mb-3">

<label>
Name
</label>

<input
id="customerName"
class="form-control"
required>

</div>


<div class="mb-3">

<label>
Phone
</label>

<input
id="customerPhone"
class="form-control"
required>

</div>


<div class="mb-3">

<label>
Order Type
</label>

<select
id="orderType"
class="form-select">

<option>
Pickup
</option>

<option>
Delivery
</option>

</select>

</div>


<div class="mb-3">

<label>
Address / Note
</label>

<textarea
id="address"
class="form-control"
rows="3"
placeholder="Address for delivery or pickup note">

</textarea>

</div>


<div class="mb-3">

<label>
Payment
</label>

<select
id="payment"
class="form-select">

<option value="Cash">
Cash
</option>

<option value="QR Payment">
QR Payment
</option>

</select>

</div>


<button
class="btn btn-warning btn-lg w-100">

Place Order

</button>


</form>

</div>

</div>


<div class="col-lg-5">

<div class="form-card">

<h4>
Order Summary
</h4>

<div id="summary">

</div>

</div>

</div>


</div>

</div>


<script src="js/database.js"></script>

<script src="js/checkout.js"></script>

</body>

</html>
