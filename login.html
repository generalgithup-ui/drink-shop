<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login - DrinkHub</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-bg">

<div class="container">

    <div class="auth-card">

        <div class="text-center mb-4">

            <div class="brand-icon">

                <i class="bi bi-cup-straw"></i>

            </div>

            <h2>
                Welcome Back
            </h2>

            <p class="text-muted">
                Login to DrinkHub
            </p>

        </div>


        <div id="loginAlert"></div>


        <form id="loginForm">

            <div class="mb-3">

                <label>
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    class="form-control"
                    required>

            </div>


            <div class="mb-3">

                <label>
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    class="form-control"
                    required>

            </div>


            <button
                class="btn btn-warning w-100 fw-bold">

                Login

            </button>

        </form>


        <div class="demo-box mt-3">

            <strong>
                Admin Demo
            </strong>

            <br>

            Email:
            admin@gmail.com

            <br>

            Password:
            admin123

        </div>


        <p class="text-center mt-3">

            No account?

            <a href="register.html">
                Create account
            </a>

        </p>


        <p class="text-center">

            <a href="index.html">
                Back to Home
            </a>

        </p>

    </div>

</div>


<script src="js/database.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
