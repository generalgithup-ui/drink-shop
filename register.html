<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register - DrinkHub</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<link
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>


<body class="auth-bg">


<div class="container">

<div class="auth-card">

<div class="text-center mb-4">

<div class="brand-icon">

<i class="bi bi-person-plus"></i>

</div>

<h2>
Create Account
</h2>

<p class="text-muted">
Join DrinkHub today
</p>

</div>


<div id="registerAlert"></div>


<form id="registerForm">


<div class="mb-3">

<label>
Full Name
</label>

<input
id="name"
class="form-control"
required>

</div>


<div class="mb-3">

<label>
Email
</label>

<input
id="email"
type="email"
class="form-control"
required>

</div>


<div class="mb-3">

<label>
Phone
</label>

<input
id="phone"
class="form-control"
required>

</div>


<div class="mb-3">

<label>
Password
</label>

<input
id="password"
type="password"
minlength="6"
class="form-control"
required>

</div>


<div class="mb-3">

<label>
Confirm Password
</label>

<input
id="confirmPassword"
type="password"
class="form-control"
required>

</div>


<button
class="btn btn-warning w-100 fw-bold">

Register

</button>

</form>


<p class="text-center mt-3">

Already have an account?

<a href="login.html">
Login
</a>

</p>


</div>

</div>


<script src="js/database.js"></script>

<script src="js/auth.js"></script>

</body>

</html>
